<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KH EMS - 효율적인 인사 관리를 위한 직원 관리 시스템 대시보드">
    <title>Dashboard | KH EMS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">KH EMS</div>
        </div>
        <nav class="nav-menu">
            <a href="/" class="nav-item active">
                <i class="fas fa-chart-line"></i>
                <span>대시보드</span>
            </a>
            <a href="/employee/list" class="nav-item">
                <i class="fas fa-users"></i>
                <span>직원 관리</span>
            </a>
            <a href="/department/list" class="nav-item">
                <i class="fas fa-building"></i>
                <span>부서 관리</span>
            </a>
            <a href="/job/list" class="nav-item">
                <i class="fas fa-id-card"></i>
                <span>직급 관리</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="page-title">대시보드</h1>

        <div class="stats-grid">
            <!-- 직원 수 Card -->
            <div class="stat-card">
                <div class="stat-icon icon-blue">
                    <i class="fas fa-user-tie"></i>
                </div>
                <span class="stat-label">전체 직원 수</span>
                <div id="emp-count" class="stat-value">0</div>
                <div class="stat-trend trend-up">
                    <i class="fas fa-arrow-up"></i>
                    <span>현재 시스템 등록 인원</span>
                </div>
            </div>

            <!-- 부서 수 Card -->
            <div class="stat-card">
                <div class="stat-icon icon-emerald">
                    <i class="fas fa-sitemap"></i>
                </div>
                <span class="stat-label">총 부서 수</span>
                <div id="dept-count" class="stat-value">0</div>
                <div class="stat-trend trend-up">
                    <i class="fas fa-check-circle"></i>
                    <span>운영 중인 부서</span>
                </div>
            </div>

            <!-- 직급 수 Card -->
            <div class="stat-card">
                <div class="stat-icon icon-amber">
                    <i class="fas fa-award"></i>
                </div>
                <span class="stat-label">총 직급 수</span>
                <div id="job-count" class="stat-value">0</div>
                <div class="stat-trend trend-up">
                    <i class="fas fa-info-circle"></i>
                    <span>정의된 직급 단계</span>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <section class="chat-section">
            <div class="chat-header">
                <div class="chat-title">
                    <i class="fas fa-comments"></i>
                    <span>사내 익명 게시판 / 채팅</span>
                </div>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span style="font-size: 0.875rem; color: var(--text-secondary);">온라인: 12명</span>
                </div>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="message received">
                    <span class="message-info">김철수 사원 • 오전 10:24</span>
                    오늘 점심 메뉴 뭔가요?
                </div>
                <div class="message received">
                    <span class="message-info">이영희 대리 • 오전 10:25</span>
                    식단표 보니까 오늘은 돈까스네요!
                </div>
                <div class="message sent">
                    <span class="message-info">나 • 오전 10:26</span>
                    오, 좋네요! 같이 가실 분?
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="메시지를 입력하세요...">
                <button id="send-btn" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </section>

        <!-- Optional: Welcome or recent activities can be added here -->
    </main>

    <script>
        // Simple interactivity for navigation items
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Chat Interactivity
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text) {
                const now = new Date();
                const timeStr = now.getHours() >= 12 ? '오후' : '오전';
                const hour = now.getHours() % 12 || 12;
                const minute = String(now.getMinutes()).padStart(2, '0');
                const timestamp = `${timeStr} ${hour}:${minute}`;

                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.innerHTML = `
                    <span class="message-info">나 • ${timestamp}</span>
                    ${text}
                `;
                chatMessages.appendChild(messageDiv);
                chatInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Simple auto-reply simulation
                setTimeout(() => {
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'message received';
                    replyDiv.innerHTML = `
                        <span class="message-info">시스템 알림 • ${timestamp}</span>
                        메시지가 정상적으로 전달되었습니다.
                    `;
                    chatMessages.appendChild(replyDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 1000);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Async fetch for statistics
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/stats/counts')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('emp-count').innerText = data.empCount.toLocaleString();
                    document.getElementById('dept-count').innerText = data.deptCount.toLocaleString();
                    document.getElementById('job-count').innerText = data.jobCount.toLocaleString();
                })
                .catch(error => console.error('Error fetching stats:', error));

            // Initial scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>

</html>
